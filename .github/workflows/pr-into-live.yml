name: 'PR into Live'
on:
  pull_request:
    branches: [live]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr_checks:
    name: '[LIVE/pr] Validate Source, Version, and Run Checks'
    runs-on: ubuntu-latest
    # Ensure this runs only for PRs originating from the same repository to
    # prevent abuse of repository secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      # Ensure PR is from the DEV branch, as we only want to allow merges from
      # DEV into LIVE.
      - name: 'Enforce PR Source Branch'
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" != "dev" ]]; then
            echo "❌ Error: Pull requests into 'live' are only allowed from the 'dev' branch."
            echo "This PR is from: ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi
          echo "✅ PR is from DEV branch. Continuing."

      - name: 'Checkout PR Code'
        uses: actions/checkout@v6
        with:
          # Fetches history so we can compare branches
          fetch-depth: 0

      # Check if the version in package.json has been bumped compared to the
      # target branch (live).
      - name: 'Check Version Bump'
        run: |
          # Fetch the target branch (live) invisibly
          git fetch origin ${{ github.event.pull_request.base.ref }}

          # Extract versions natively using jq and git show
          LIVE_VERSION=$(git show origin/${{ github.event.pull_request.base.ref }}:package.json | jq -r .version)
          PR_VERSION=$(jq -r .version package.json)

          echo "LIVE Version: $LIVE_VERSION"
          echo "PR Version: $PR_VERSION"

          if [[ "$LIVE_VERSION" == "$PR_VERSION" ]]; then
            echo "❌ Error: Version has not been bumped! Both are $LIVE_VERSION."
            exit 1
          fi
          echo "✅ Version is bumped."

      # Install NodeJS required for development tools and checks.
      - name: 'Install NodeJS via package.json engines.node (currently 24)'
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      # Install both runtime dependencies and dev dependencies.
      - name: 'Install Dependencies'
        run: npm ci --include=dev

      # Sync astro virtual modules before lint so content API types are available
      - name: 'Sync Astro Virtual Modules'
        run: npm run sync

      # Check code quality
      - name: 'Run Code Lint'
        run: npm run lint

      # Check code formatting
      - name: 'Run Code Format Check'
        run: npm run stylecheck

      # Check spelling throughout the codebase
      - name: 'Run Code Spelling Check'
        run: npm run spellcheck

      # Check for type errors via astro check
      - name: 'Run Code Type Check'
        run: npm run check
