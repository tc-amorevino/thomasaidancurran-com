name: 'Push into Live'
on:
  push:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    name: '[LIVE/push] Build and Deploy to GitHub Pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v6

      # Install Node.js required for build and deploy steps
      - name: 'Install Node.js via package.json engines.node (currently 24)'
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      # Install both runtime dependencies and dev dependencies
      - name: 'Install Dependencies'
        run: npm ci --include=dev

      # Build the runtime code (/dist folder)
      - name: 'Build Astro App'
        env:
          # Scope production mode to the build step to avoid side effects in other steps.
          NODE_ENV: production
        run: npm run build

      # Upload the built site as a GitHub Pages artifact
      - name: 'Upload GitHub Pages Artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Deploy the uploaded artifact to GitHub Pages
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v4
